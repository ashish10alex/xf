# A v* tag publishes a release: the archives and checksums as a GitHub
# Release, the cask in ashish10alex/homebrew-tap, the manifest in
# ashish10alex/scoop-bucket, and a pull request to microsoft/winget-pkgs
# (see .goreleaser.yaml and docs/agents/releasing.md).
#
# XF_PACKAGES_TOKEN is a classic token with the public_repo scope: it pushes
# to homebrew-tap, scoop-bucket and the winget-pkgs fork, and opens the pull
# request on microsoft/winget-pkgs, which a fine-grained token can't reach.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser reads the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XF_PACKAGES_TOKEN: ${{ secrets.XF_PACKAGES_TOKEN }}
          # Set the repository variable while a winget pull request is
          # pending, to leave winget out of this release.
          XF_SKIP_WINGET: ${{ vars.XF_SKIP_WINGET }}
