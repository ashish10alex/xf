<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0e0d"/>
      <stop offset="100%" stop-color="#121513"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="25%" stop-color="#d2a8ff"/>
      <stop offset="50%" stop-color="#ff9bce"/>
      <stop offset="75%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#8fd694"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#ramp)"/>

  <!-- Background Pane Grid Frame -->
  <rect x="64" y="64" width="1072" height="502" rx="12" fill="#0f1211" stroke="#2a302d" stroke-width="2"/>
  <rect x="84" y="54" width="146" height="20" fill="#0c0e0d"/>
  <text x="92" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#8fd694">1 actions · xf</text>

  <!-- Logo Badge -->
  <rect x="110" y="120" width="88" height="88" rx="18" fill="#1a7f37"/>
  <text x="154" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="46" font-weight="700" text-anchor="middle" fill="#ffffff">xf</text>

  <!-- Title & Pitch -->
  <text x="110" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="700" fill="#e6edf3">Dataform &amp; dbt on BigQuery,</text>
  <text x="110" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="700" fill="#8fd694">in one single binary.</text>

  <text x="110" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#7d8590">Browser UI (xf web) · Terminal UI · LSP · Branch Cost &amp; Column Impact</text>

  <!-- Install Command Pill -->
  <rect x="110" y="446" width="660" height="64" rx="8" fill="#0c0e0d" stroke="#8fd694" stroke-width="1.5"/>
  <text x="136" y="485" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#7d8590">$</text>
  <text x="164" y="485" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#e6edf3">brew install --cask ashish10alex/tap/xf</text>

  <text x="1090" y="485" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" text-anchor="end" fill="#7d8590">xf.dataformtools.com</text>
</svg>
