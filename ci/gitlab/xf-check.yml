# xf check for GitLab CI (ADR 0040): the column impact and query cost of a
# merge request's Dataform or dbt changes, as one note on the merge request
# and a Code Quality report on the changed lines. See docs/checks.md.
#
# Include it at a tag of xf, and set what it needs as CI/CD variables:
#
#   include:
#     - remote: https://raw.githubusercontent.com/ashish10alex/xf/<tag>/ci/gitlab/xf-check.yml
#   xf-check:
#     variables:
#       XF_VERSION: <tag>
#
#   XF_FORGE_TOKEN                  a project access token with the api scope and the
#                                   Reporter role, masked: it posts the note
#   GOOGLE_APPLICATION_CREDENTIALS  a File variable: a service account key, or a
#                                   workload identity federation config
xf-check:
  stage: test
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"            # xf needs history to find the merge-base
    XF_VERSION: ""            # the xf release, such as v0.0.4; empty for the latest
    XF_DIR: "."               # the project's folder in the repository
    XF_COMMENT: "true"        # post the report as one note, edited on each push
    XF_FAIL_ON: ""            # critical or warning: fail at that column change severity
    XF_FAIL_OVER: ""          # such as 100GB: fail when the changed actions scan more
    XF_QUIET_UNDER: "1GiB"    # cost alone needs a run to grow this much for a note
    XF_INSTALL_DATAFORM: auto # auto installs the Dataform CLI unless XF_DIR is a dbt project
    XF_ARGS: ""               # more flags for xf check, split on spaces
  script:
    - |
      set -uo pipefail
      case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) echo "xf check runs on x86_64 and arm64"; exit 2 ;; esac
      if [ -n "$XF_VERSION" ]; then
        url="https://github.com/ashish10alex/xf/releases/download/$XF_VERSION/xf_linux_${arch}.tar.gz"
      else
        url="https://github.com/ashish10alex/xf/releases/latest/download/xf_linux_${arch}.tar.gz"
      fi
      mkdir -p "$CI_PROJECT_DIR/.xf-bin"
      curl -fsSL "$url" | tar -xz -C "$CI_PROJECT_DIR/.xf-bin" xf || exit 2
      export PATH="$CI_PROJECT_DIR/.xf-bin:$PATH"
      xf --version

      git fetch --no-tags --quiet origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      git checkout -q -B "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "$CI_COMMIT_SHA"   # the report names the branch

      cd "$XF_DIR" || exit 2
      if [ "$XF_INSTALL_DATAFORM" = true ] || { [ "$XF_INSTALL_DATAFORM" = auto ] && [ ! -f dbt_project.yml ]; }; then
        if [ -f package.json ]; then npm ci || exit 2; fi
        version=""
        if [ -f workflow_settings.yaml ]; then
          version=$(sed -n 's/^dataformCoreVersion:[[:space:]]*["'\'']\{0,1\}\([^"'\'' ]*\).*/\1/p' workflow_settings.yaml | head -n 1)
        fi
        npm i -g "@dataform/cli${version:+@$version}" || exit 2
      fi

      flags=(--output "$CI_PROJECT_DIR/xf-check.md" --codequality "$CI_PROJECT_DIR/xf-check-codequality.json"
        --quiet-under "$XF_QUIET_UNDER" --default-branch "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")
      [ "$XF_COMMENT" = true ] && flags+=(--comment)
      [ -n "$XF_FAIL_ON" ] && flags+=(--fail-on "$XF_FAIL_ON")
      [ -n "$XF_FAIL_OVER" ] && flags+=(--fail-over "$XF_FAIL_OVER")
      xf check "${flags[@]}" $XF_ARGS
      code=$?
      if [ "$code" -eq 2 ]; then cat "${TMPDIR:-/tmp}"/xf-*.log 2>/dev/null | tail -n 50 || true; fi
      exit "$code"
  artifacts:
    when: always
    paths:
      - xf-check.md
    reports:
      codequality: xf-check-codequality.json
