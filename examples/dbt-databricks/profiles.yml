# Builds in a Databricks workspace, such as a Free Edition one, and reads
# the TPC-H tables of its samples catalog. Nothing personal is written
# here: the workspace, SQL warehouse and token come from the environment.
#
#   DATABRICKS_HOST       the workspace, e.g. dbc-1234abcd-5678.cloud.databricks.com
#   DATABRICKS_HTTP_PATH  a SQL warehouse's HTTP path, /sql/1.0/warehouses/<id>;
#                         unset, xf web asks which warehouse to use
#   DATABRICKS_TOKEN      a personal access token; unset, xf asks the Databricks
#                         CLI (`databricks auth login --host <workspace>` first)
#   DATABRICKS_CATALOG    the catalog to build in (default: workspace)
xf_databricks_example:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'dbc-00000000-0000.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: xf_example
      threads: 4
